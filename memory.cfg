MEMORY {
    HDR:   start=0,     size=16,    file=%O;
    ZP:    start=0,     size=256,   file="";
    OAM:   start=$200,  size=256,   file="";
    CODE:  start=$8000, size=$7FFA, file=%O, fill=yes;
    IRQV:  start=$FFFA, size=6,     file=%O;
    CHR:   start=0,     size=$2000, file=%O, fill=yes;
}

SEGMENTS {
    ZP:      load=ZP,    type=zp;
    OAM:     load=OAM,   type=bss, define=yes;
    HEADER:  load=HDR,   type=ro;
    CODE:    load=CODE,  type=ro;
    VECTORS: load=IRQV,  type=ro;
    CHRROM:  load=CHR,   type=ro;
}